basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      Email:
        type: string
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.UserFindRequest:
    properties:
      user_id:
        type: string
    type: object
  game.AnalyseGameRequest:
    properties:
      game_secret_key:
        type: string
    type: object
  game.ArchiveNamesResponse:
    properties:
      names:
        items:
          $ref: '#/definitions/game.NameGameStruct'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveResponse:
    properties:
      games:
        items:
          $ref: '#/definitions/game.GameFromArchive'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveYearsResponse:
    properties:
      years:
        items:
          $ref: '#/definitions/game.YearGameStruct'
        type: array
    type: object
  game.BotGenerateMoveResponse:
    properties:
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      sgf:
        type: string
    type: object
  game.CreateBotGameRequest:
    properties:
      board_size:
        type: integer
      is_creator_black:
        type: boolean
      komi:
        type: number
      rules:
        type: string
    type: object
  game.CreateGameRequest:
    properties:
      board_size:
        type: integer
      is_creator_black:
        type: boolean
      komi:
        type: number
      rules:
        type: string
    type: object
  game.FindGameInArchive:
    properties:
      game_id:
        type: string
    type: object
  game.Game:
    properties:
      board_size:
        type: integer
      created_at:
        type: string
      current_turn:
        type: string
      game_key:
        description: уникальный ключ
        type: string
      game_key_public:
        type: string
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      player_black:
        type: string
      player_white:
        type: string
      rules:
        type: string
      sgf:
        type: string
      started_at:
        type: string
      status:
        type: string
      users:
        items:
          $ref: '#/definitions/game.GameUser'
        type: array
      who_is_next:
        description: color
        type: string
    type: object
  game.GameCreateResponse:
    properties:
      public_key:
        type: string
    type: object
  game.GameFromArchive:
    properties:
      blackPlayer:
        type: string
      blackRank:
        type: string
      boardSize:
        type: integer
      date:
        type: string
      event:
        type: string
      game_id:
        type: string
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      result:
        $ref: '#/definitions/game.Result'
      rules:
        type: string
      sgf:
        type: string
      whitePlayer:
        type: string
      whiteRank:
        type: string
    type: object
  game.GameJoinRequest:
    properties:
      public_key:
        type: string
      role:
        type: string
    type: object
  game.GameUser:
    properties:
      color:
        type: string
      id:
        type: string
      nickname:
        type: string
      rating:
        type: number
      role:
        type: string
      score:
        type: number
    type: object
  game.GenerateMoveRequest:
    properties:
      move:
        $ref: '#/definitions/game.Move'
    type: object
  game.GetGameInfoRequest:
    properties:
      game_key:
        type: string
    type: object
  game.GetGameInfoResponse:
    properties:
      game:
        $ref: '#/definitions/game.Game'
      player_black_nickname:
        type: string
      player_white_nickname:
        type: string
    type: object
  game.KataGoResponse:
    properties:
      error:
        type: string
      id:
        type: string
      isDuringSearch:
        type: boolean
      moveInfos:
        items:
          $ref: '#/definitions/game.MoveInfo'
        type: array
      ownership:
        items:
          type: number
        type: array
      policy:
        items:
          type: number
        type: array
      rootInfo:
        $ref: '#/definitions/game.RootInfo'
      turnNumber:
        type: integer
    type: object
  game.Move:
    properties:
      color:
        type: string
      coordinates:
        type: string
    type: object
  game.MoveInfo:
    properties:
      edgeVisits:
        type: integer
      edgeWeight:
        type: number
      lcb:
        type: number
      move:
        type: string
      order:
        type: integer
      prior:
        type: number
      pv:
        items:
          type: string
        type: array
      scoreLead:
        type: number
      scoreMean:
        type: number
      scoreSelfplay:
        type: number
      scoreStdev:
        type: number
      utility:
        type: number
      utilityLcb:
        type: number
      visits:
        type: integer
      weight:
        type: number
      winrate:
        type: number
    type: object
  game.NameGameStruct:
    properties:
      count_of_games:
        type: integer
      name:
        type: string
    type: object
  game.Result:
    properties:
      pointDiff:
        type: number
      winColor:
        type: string
    type: object
  game.RootInfo:
    properties:
      currentPlayer:
        type: string
      rawLead:
        type: number
      rawNoResultProb:
        type: number
      rawScoreSelfplay:
        type: number
      rawScoreSelfplayStdev:
        type: number
      rawStScoreError:
        type: number
      rawStWrError:
        type: number
      rawVarTimeLeft:
        type: number
      rawWinrate:
        type: number
      scoreLead:
        type: number
      scoreSelfplay:
        type: number
      scoreStdev:
        type: number
      symHash:
        type: string
      thisHash:
        type: string
      utility:
        type: number
      visits:
        type: integer
      weight:
        type: number
      winrate:
        type: number
    type: object
  game.YearGameStruct:
    properties:
      count_of_games:
        type: integer
      year:
        type: integer
    type: object
  httpresponse.ErrorResponse:
    properties:
      ErrorDescription:
        type: string
    type: object
  httpresponse.Response:
    properties:
      Body: {}
      Status:
        type: integer
    type: object
  task.Task:
    properties:
      task_level:
        description: |-
          Difficulty level (chapter index) of the task
          required: true
          example: 3
        type: integer
      task_number:
        description: |-
          Unique identifier for this task
          required: true
          example: 42
        type: integer
      task_sgf:
        description: |-
          Raw SGF content of the problem
          required: true
          example: "(;SZ[19]... )"
        type: string
      task_status:
        description: |-
          Current status, one of "done" or "not_done"
          required: true
          example: "not_done"
        type: string
    type: object
  task.TaskResponse:
    properties:
      page_tmp:
        description: |-
          Current page number (1-based)
          required: true
          example: 1
        type: integer
      page_with_unresolved:
        description: |-
          First page that still contains not_done tasks
          required: true
          example: 1
        type: integer
      tasks:
        description: |-
          Tasks on this page
          required: true
        items:
          $ref: '#/definitions/task.Task'
        type: array
      total_pages:
        description: |-
          Total number of pages available
          required: true
          example: 5
        type: integer
    type: object
  user.User:
    properties:
      Username:
        type: string
      avatar_url:
        type: string
      coins:
        type: integer
      created_at:
        type: string
      current_game_key:
        type: string
      done_tasks_ids:
        items:
          type: integer
        type: array
      email:
        type: string
      id:
        type: string
      passwordHash:
        type: string
      passwordSalt:
        type: string
      rating:
        type: integer
      social_links:
        additionalProperties:
          type: string
        type: object
      statistic:
        $ref: '#/definitions/user.UserStatistic'
      status:
        type: string
      updated_at:
        type: string
    type: object
  user.UserStatistic:
    properties:
      achievements:
        items:
          type: string
        type: array
      draws:
        type: integer
      losses:
        type: integer
      wins:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Документация API авторизации и пользователей
  version: "1.0"
paths:
  /JoinGame:
    post:
      consumes:
      - application/json
      description: Добавляет пользователя в игру по публичному ключу. Нужна авторизация.
      parameters:
      - description: Ключ и роль
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.GameJoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Игра не найдена / пользователь уже в игре
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Присоединиться к существующей игре
      tags:
      - game
  /NewGame:
    post:
      consumes:
      - application/json
      description: Регистрирует новую запись в базе и отдаёт публичный ключ партии.
        Нужна авторизация.
      parameters:
      - description: Параметры игры
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.CreateGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.GameCreateResponse'
        "400":
          description: Ошибочные параметры или пользователь уже в игре
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Нет cookie sessionID
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Создать новую игру человека против человека
      tags:
      - game
  /analyseCurrent:
    post:
      consumes:
      - application/json
      description: Отправляет SGF текущей игры в KataGo для анализа. Если ключ не
        передан, будет использована активная игра пользователя.
      parameters:
      - description: Секретный ключ игры (опционально)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.AnalyseGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Результаты анализа от KataGo
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.KataGoResponse'
              type: object
        "400":
          description: Ошибка запроса или анализа игры
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Анализ текущего состояния игры
      tags:
      - game
  /generateMove:
    post:
      consumes:
      - application/json
      description: Обрабатывает ход пользователя, генерирует ответный ход бота и возвращает
        обновлённый список ходов и SGF партии.
      parameters:
      - description: Ход пользователя
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.GenerateMoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Список ходов и новый SGF
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.BotGenerateMoveResponse'
              type: object
        "400":
          description: Неверный JSON или ошибка логики игры
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Сгенерировать ход против бота
      tags:
      - game
  /getArchive:
    get:
      description: Возвращает страницу архивных игр с возможностью фильтрации по году
        или имени игрока (один из параметров обязателен).
      parameters:
      - description: Фильтр по году (если не указан фильтр по имени)
        in: query
        name: year
        type: integer
      - description: Фильтр по имени игрока (если не указан год)
        in: query
        name: name
        type: string
      - description: Номер страницы (по умолчанию 0)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Страница архивных игр
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.ArchiveResponse'
              type: object
        "400":
          description: Некорректный запрос или ошибка получения архива
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизованный
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить список игр из архива с пагинацией
      tags:
      - game
  /getAvailableGamesForUser:
    get:
      description: Возвращает постраничный список задач указанного уровня сложности
        с пометкой «решена/нет».
      parameters:
      - description: Номер страницы (1‑based)
        in: query
        name: page
        required: true
        type: integer
      - description: Уровень сложности
        in: query
        name: level
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "416":
          description: Некорректные параметры
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Список задач пользователя
      tags:
      - tasks
  /getGameByPublicKey:
    post:
      consumes:
      - application/json
      description: Возвращает подробную информацию об игре по её публичному ключу.
      parameters:
      - description: Публичный ключ игры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GetGameInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Информация об игре
          schema:
            $ref: '#/definitions/game.GetGameInfoResponse'
        "400":
          description: Некорректный запрос или ошибка в формате JSON
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Получить игру по публичному ключу
      tags:
      - game
  /getGameFromArchiveById:
    post:
      consumes:
      - application/json
      description: Возвращает запись об архивной игре по её идентификатору в архиве.
      parameters:
      - description: Идентификатор записи архива
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.FindGameInArchive'
      produces:
      - application/json
      responses:
        "200":
          description: Данные архивной игры
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.GameFromArchive'
              type: object
        "400":
          description: Некорректный запрос или ошибка поиска игры
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить игру из архива по идентификатору
      tags:
      - game
  /getNamesInArchive:
    get:
      description: Возвращает страницу с именами игроков, отсортированными по количеству
        сыгранных игр.
      parameters:
      - description: Номер страницы (по умолчанию 1)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Страница имён игроков
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.ArchiveNamesResponse'
              type: object
        "400":
          description: Ошибка получения списка имён
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить список игроков из архива
      tags:
      - game
  /getUserById:
    post:
      consumes:
      - application/json
      description: Возвращает пользователя по его ID. Требуется авторизация по cookie.
      parameters:
      - description: ID пользователя
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.UserFindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Некорректный JSON или пользователь не найден
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить данные пользователя
      tags:
      - user
  /getYearsInArchive:
    get:
      consumes:
      - application/json
      description: Возвращает отсортированный список лет, за которые имеются архивные
        игры.
      produces:
      - application/json
      responses:
        "200":
          description: Список годов
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.ArchiveYearsResponse'
              type: object
        "400":
          description: Ошибка получения годов
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизованный
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить список годов в архиве
      tags:
      - game
  /leaveGame:
    get:
      description: Освобождает слот игрока. Требуется авторизация.
      parameters:
      - description: Публичный ключ игры
        in: query
        name: public_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Покинуть игру
      tags:
      - game
  /login:
    post:
      consumes:
      - application/json
      description: Проверяет логин/пароль и устанавливает cookie `sessionID`.
      parameters:
      - description: Логин и пароль
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Пользователь не найден / неверный пароль / плохой JSON
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Вход пользователя
      tags:
      - auth
  /logout:
    post:
      description: Удаляет сессию, указанную в cookie `sessionID`.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Нет cookie или сессия не найдена
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Выход пользователя
      tags:
      - auth
  /markTaskAsDone:
    get:
      description: Добавляет ID задачи в список выполненных пользователя.
      parameters:
      - description: ID задачи
        in: query
        name: taskID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "416":
          description: Некорректный taskID
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Отметить задачу как решённую
      tags:
      - tasks
  /newBotGame:
    post:
      consumes:
      - application/json
      description: Создаёт новую игру против бота и возвращает секретный ключ игры.
      parameters:
      - description: Параметры новой игры с ботом
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.CreateBotGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Секретный ключ игры
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Ошибка создания игры
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Создать новую игру с ботом
      tags:
      - game
  /register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и сразу устанавливает cookie `sessionID`.
      parameters:
      - description: Учётные данные
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Ответ без тела — только Status
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Некорректный запрос (например, плохой JSON)
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Регистрация пользователя
      tags:
      - auth
  /startGame:
    get:
      description: Апгрейд HTTP→WS для обмена ходами в режиме реального времени. После
        ответа 101 дальнейшее общение идёт по протоколу WebSocket.
      parameters:
      - description: Публичный ключ игры
        in: query
        name: game_id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "101":
          description: Переключение протокола
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: WebSocket‑сессия игры
      tags:
      - game
  /storeTasksToMongoByPath:
    get:
      description: Рекурсивно читает все файлы `*.sgf` по указанному пути и сохраняет
        их в коллекцию `tasks`.
      parameters:
      - description: Путь к директории с SGF
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ОК
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не поддерживается
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "416":
          description: Ошибка чтения файлов
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Загрузить задачи SGF в MongoDB
      tags:
      - tasks
securityDefinitions:
  ApiKeyAuth:
    in: cookie
    name: sessionID
    type: apiKey
swagger: "2.0"
