basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      Email:
        type: string
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.UserFindRequest:
    properties:
      user_id:
        type: string
    type: object
  game.AnalyseGameRequest:
    properties:
      game_public_key:
        type: string
    type: object
  game.ArchiveNamesResponse:
    properties:
      names:
        items:
          $ref: '#/definitions/game.NameGameStruct'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveResponse:
    properties:
      games:
        items:
          $ref: '#/definitions/game.GameFromArchive'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveYearsResponse:
    properties:
      years:
        items:
          $ref: '#/definitions/game.YearGameStruct'
        type: array
    type: object
  game.CreateGameRequest:
    properties:
      board_size:
        type: integer
      is_creator_black:
        type: boolean
      komi:
        type: number
      rules:
        type: string
    type: object
  game.FindGameInArchive:
    properties:
      game_id:
        type: string
    type: object
  game.Game:
    properties:
      board_size:
        type: integer
      created_at:
        type: string
      current_turn:
        type: string
      game_key:
        description: уникальный ключ
        type: string
      game_key_public:
        type: string
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      player_black:
        type: string
      player_white:
        type: string
      rules:
        type: string
      sgf:
        type: string
      started_at:
        type: string
      status:
        type: string
      users:
        items:
          $ref: '#/definitions/game.GameUser'
        type: array
      who_is_next:
        description: color
        type: string
    type: object
  game.GameCreateResponse:
    properties:
      public_key:
        type: string
    type: object
  game.GameFromArchive:
    properties:
      blackPlayer:
        type: string
      blackRank:
        type: string
      boardSize:
        type: integer
      date:
        type: string
      event:
        type: string
      game_id:
        type: string
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      result:
        $ref: '#/definitions/game.Result'
      rules:
        type: string
      sgf:
        type: string
      whitePlayer:
        type: string
      whiteRank:
        type: string
    type: object
  game.GameJoinRequest:
    properties:
      public_key:
        type: string
      role:
        type: string
    type: object
  game.GameLeaveRequest:
    properties:
      public_key:
        type: string
    type: object
  game.GameStateResponse:
    properties:
      move:
        $ref: '#/definitions/game.Move'
      move_info:
        $ref: '#/definitions/game.MoveInfoWS'
    type: object
  game.GameUser:
    properties:
      color:
        type: string
      id:
        type: string
      nickname:
        type: string
      rating:
        type: number
      role:
        type: string
      score:
        type: number
    type: object
  game.GetGameInfoRequest:
    properties:
      game_key:
        type: string
    type: object
  game.GetGameInfoResponse:
    properties:
      game:
        $ref: '#/definitions/game.Game'
      player_black_nickname:
        type: string
      player_white_nickname:
        type: string
    type: object
  game.JsonOKResponse:
    properties:
      text:
        type: string
    type: object
  game.KataGoResponse:
    properties:
      error:
        type: string
      id:
        type: string
      isDuringSearch:
        type: boolean
      moveInfos:
        items:
          $ref: '#/definitions/game.MoveInfo'
        type: array
      ownership:
        items:
          type: number
        type: array
      policy:
        items:
          type: number
        type: array
      rootInfo:
        $ref: '#/definitions/game.RootInfo'
      turnNumber:
        type: integer
    type: object
  game.Move:
    properties:
      color:
        type: string
      coordinates:
        type: string
    type: object
  game.MoveInfo:
    properties:
      edgeVisits:
        type: integer
      edgeWeight:
        type: number
      lcb:
        type: number
      move:
        type: string
      order:
        type: integer
      prior:
        type: number
      pv:
        items:
          type: string
        type: array
      scoreLead:
        type: number
      scoreMean:
        type: number
      scoreSelfplay:
        type: number
      scoreStdev:
        type: number
      utility:
        type: number
      utilityLcb:
        type: number
      visits:
        type: integer
      weight:
        type: number
      winrate:
        type: number
    type: object
  game.MoveInfoWS:
    properties:
      error:
        type: string
      isGameFinished:
        type: boolean
      isMoveCorrect:
        type: boolean
      newSgf:
        type: string
    type: object
  game.NameGameStruct:
    properties:
      count_of_games:
        type: integer
      name:
        type: string
    type: object
  game.Result:
    properties:
      pointDiff:
        type: number
      winColor:
        type: string
    type: object
  game.RootInfo:
    properties:
      currentPlayer:
        type: string
      rawLead:
        type: number
      rawNoResultProb:
        type: number
      rawScoreSelfplay:
        type: number
      rawScoreSelfplayStdev:
        type: number
      rawStScoreError:
        type: number
      rawStWrError:
        type: number
      rawVarTimeLeft:
        type: number
      rawWinrate:
        type: number
      scoreLead:
        type: number
      scoreSelfplay:
        type: number
      scoreStdev:
        type: number
      symHash:
        type: string
      thisHash:
        type: string
      utility:
        type: number
      visits:
        type: integer
      weight:
        type: number
      winrate:
        type: number
    type: object
  game.YearGameStruct:
    properties:
      count_of_games:
        type: integer
      year:
        type: integer
    type: object
  httpresponse.ErrorResponse:
    properties:
      ErrorDescription:
        type: string
    type: object
  task.Task:
    properties:
      task_level:
        description: |-
          Difficulty level (chapter index) of the task
          required: true
          example: 3
        type: integer
      task_number:
        description: |-
          Unique identifier for this task
          required: true
          example: 42
        type: integer
      task_sgf:
        description: |-
          Raw SGF content of the problem
          required: true
          example: "(;SZ[19]... )"
        type: string
      task_status:
        description: |-
          Current status, one of "done" or "not_done"
          required: true
          example: "not_done"
        type: string
    type: object
  task.TaskResponse:
    properties:
      page_tmp:
        description: |-
          Current page number (1-based)
          required: true
          example: 1
        type: integer
      page_with_unresolved:
        description: |-
          First page that still contains not_done tasks
          required: true
          example: 1
        type: integer
      tasks:
        description: |-
          Tasks on this page
          required: true
        items:
          $ref: '#/definitions/task.Task'
        type: array
      total_pages:
        description: |-
          Total number of pages available
          required: true
          example: 5
        type: integer
    type: object
  user.User:
    properties:
      Username:
        type: string
      avatar_url:
        type: string
      coins:
        type: integer
      created_at:
        type: string
      current_game_key:
        type: string
      done_tasks_ids:
        items:
          type: integer
        type: array
      email:
        type: string
      id:
        type: string
      passwordHash:
        type: string
      passwordSalt:
        type: string
      rating:
        type: integer
      social_links:
        additionalProperties:
          type: string
        type: object
      statistic:
        $ref: '#/definitions/user.UserStatistic'
      status:
        type: string
      updated_at:
        type: string
    type: object
  user.UserStatistic:
    properties:
      achievements:
        items:
          type: string
        type: array
      draws:
        type: integer
      losses:
        type: integer
      wins:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Документация API авторизации и пользователей
  version: "1.0"
paths:
  /JoinGame:
    post:
      consumes:
      - application/json
      description: Lets a user join an existing game by public key and role. Requires
        authentication via cookie.
      parameters:
      - description: Join game parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GameJoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully joined
          schema:
            $ref: '#/definitions/game.JsonOKResponse'
        "400":
          description: Bad request or game not found
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Join a game
      tags:
      - game
  /NewGame:
    post:
      consumes:
      - application/json
      description: Creates a new Go game with the specified board size, komi and creator
        color. Requires authentication via cookie.
      parameters:
      - description: New game parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.CreateGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Game successfully created
          schema:
            $ref: '#/definitions/game.GameCreateResponse'
        "400":
          description: Bad request (missing or invalid parameters)
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Create a new game
      tags:
      - game
  /analyseCurrent:
    post:
      consumes:
      - application/json
      description: Sends current game SGF to KataGo for analysis. Requires authentication.
      parameters:
      - description: Public key of current game
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.AnalyseGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: KataGo analysis results
          schema:
            $ref: '#/definitions/game.KataGoResponse'
        "400":
          description: Bad request or analysis error
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Analyse current game state
      tags:
      - game
  /getArchive:
    get:
      consumes:
      - application/json
      description: Returns a page of archived games, filterable by year or player
        name (at least one required).
      parameters:
      - description: Filter by year (required if name not set)
        in: query
        name: year
        type: integer
      - description: Filter by player name (required if year not set)
        in: query
        name: name
        type: string
      - description: Page number (default 0)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of archived games
          schema:
            $ref: '#/definitions/game.ArchiveResponse'
        "400":
          description: Bad request or archive retrieval error
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List archived games with pagination
      tags:
      - game
  /getAvailableGamesForUser:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of tasks at the specified difficulty level,
        marking each as done or not_done.
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        required: true
        type: integer
      - description: Task difficulty level
        in: query
        name: level
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "401":
          description: Unauthorized"                     // if no valid user cookie
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "416":
          description: Requested Range Not Satisfiable"  // e.g. missing or invalid
            parameters
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get available tasks for a user
      tags:
      - tasks
  /getGameByPublicKey:
    post:
      consumes:
      - application/json
      description: Returns detailed information about a game given its public key.
      parameters:
      - description: Game public key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GetGameInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Game information
          schema:
            $ref: '#/definitions/game.GetGameInfoResponse'
        "400":
          description: Bad request or invalid JSON
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Retrieve game by public key
      tags:
      - game
  /getGameFromArchiveById:
    post:
      consumes:
      - application/json
      description: Returns the archived game record for the given archive document
        ID.
      parameters:
      - description: Archive document ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.FindGameInArchive'
      produces:
      - application/json
      responses:
        "200":
          description: Archived game details
          schema:
            $ref: '#/definitions/game.GameFromArchive'
        "400":
          description: Bad request or invalid JSON
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Retrieve a single archived game by ID
      tags:
      - game
  /getNamesInArchive:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of player names sorted by game count.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of player names
          schema:
            $ref: '#/definitions/game.ArchiveNamesResponse'
        "400":
          description: Error retrieving names
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List most frequent players in archive
      tags:
      - game
  /getUserById:
    post:
      consumes:
      - application/json
      description: Возвращает пользователя по ID. Требуется авторизация (cookie sessionID).
      parameters:
      - description: ID пользователя для поиска
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/auth.UserFindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Only POST method is allowed
          schema:
            type: string
      summary: Получение информации о пользователе
      tags:
      - user
  /getYearsInArchive:
    get:
      consumes:
      - application/json
      description: Returns a sorted list of years for which archived games exist.
      produces:
      - application/json
      responses:
        "200":
          description: Array of years
          schema:
            $ref: '#/definitions/game.ArchiveYearsResponse'
        "400":
          description: Error retrieving years
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List available archive years
      tags:
      - game
  /leaveGame:
    post:
      consumes:
      - application/json
      description: Allows a user to leave a game by its public key. Requires authentication
        via cookie.
      parameters:
      - description: Game public key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GameLeaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully left the game
          schema:
            type: string
        "400":
          description: Bad request or invalid JSON
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Leave a game
      tags:
      - game
  /login:
    post:
      consumes:
      - application/json
      description: Авторизует пользователя по логину и паролю, устанавливает cookie
        sessionID
      parameters:
      - description: Данные пользователя для входа
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Вход пользователя
      tags:
      - auth
  /logout:
    post:
      description: Удаляет сессию пользователя по cookie sessionID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Выход пользователя
      tags:
      - auth
  /markTaskAsDone:
    get:
      consumes:
      - application/json
      description: Marks the task with the given ID as completed in the user's record.
      parameters:
      - description: Unique identifier of the task to mark as done
        in: query
        name: taskID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "401":
          description: Unauthorized"                     // if no valid user cookie
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "416":
          description: Requested Range Not Satisfiable"  // e.g. missing or invalid
            taskID
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Mark a task as done for the current user
      tags:
      - tasks
  /register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и устанавливает cookie sessionID
      parameters:
      - description: Данные пользователя для регистрации
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /startGame:
    get:
      description: Upgrades the HTTP connection to WebSocket for live move exchange.
        Query param `game_id` required.
      parameters:
      - description: Public key of the game to join via WS
        in: query
        name: game_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Initial game state or move update
          schema:
            $ref: '#/definitions/game.GameStateResponse'
        "400":
          description: Bad request (missing game_id)
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden (not a player)
          schema:
            type: string
        "404":
          description: Not Found (game not found)
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Start real‑time game via WebSocket
      tags:
      - game
  /storeTasksToMongoByPath:
    get:
      consumes:
      - application/json
      description: Reads all `.sgf` files from the given path and saves them into
        the MongoDB `tasks` collection.
      parameters:
      - description: Filesystem path to directory containing SGF files
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully stored tasks in MongoDB
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "416":
          description: Requested Range Not Satisfiable"  // e.g. error during file
            processing or Mongo insert
          schema:
            type: string
      summary: Store tasks in MongoDB
      tags:
      - tasks
securityDefinitions:
  ApiKeyAuth:
    in: cookie
    name: sessionID
    type: apiKey
swagger: "2.0"
