basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      Email:
        type: string
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.UserFindRequest:
    properties:
      user_id:
        type: string
      username:
        type: string
    type: object
  game.AlreadyInGameResponse:
    properties:
      currGameKey:
        type: string
      error:
        type: string
    type: object
  game.ArchiveNamesResponse:
    properties:
      names:
        items:
          $ref: '#/definitions/game.NameGameStruct'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveResponse:
    properties:
      games:
        items:
          $ref: '#/definitions/game.GameFromArchive'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveYearsResponse:
    properties:
      years:
        items:
          $ref: '#/definitions/game.YearGameStruct'
        type: array
    type: object
  game.BotGenerateMoveResponse:
    properties:
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      sgf:
        type: string
    type: object
  game.CreateBotGameRequest:
    properties:
      board_size:
        type: integer
      is_creator_black:
        type: boolean
      komi:
        type: number
      rules:
        type: string
    type: object
  game.CreateGameRequest:
    properties:
      board_size:
        type: integer
      is_creator_black:
        type: boolean
      komi:
        type: number
      rules:
        type: string
    type: object
  game.FindGameInArchive:
    properties:
      game_id:
        type: string
    type: object
  game.Game:
    properties:
      board_size:
        type: integer
      created_at:
        type: string
      current_turn:
        type: string
      game_key:
        description: уникальный ключ
        type: string
      game_key_public:
        type: string
      isFromArchive:
        type: boolean
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      player_black:
        type: string
      player_white:
        type: string
      rules:
        type: string
      sgf:
        type: string
      started_at:
        type: string
      status:
        type: string
      users:
        items:
          $ref: '#/definitions/game.GameUser'
        type: array
      who_is_next:
        description: color
        type: string
    type: object
  game.GameCreateResponse:
    properties:
      public_key:
        type: string
    type: object
  game.GameFromArchive:
    properties:
      blackPlayer:
        type: string
      blackRank:
        type: string
      boardSize:
        type: integer
      date:
        type: string
      event:
        type: string
      game_id:
        type: string
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      result:
        $ref: '#/definitions/game.Result'
      rules:
        type: string
      sgf:
        type: string
      whitePlayer:
        type: string
      whiteRank:
        type: string
    type: object
  game.GameJoinRequest:
    properties:
      public_key:
        type: string
      role:
        type: string
    type: object
  game.GameUser:
    properties:
      color:
        type: string
      id:
        type: string
      nickname:
        type: string
      rating:
        type: number
      role:
        type: string
      score:
        type: number
    type: object
  game.GenerateMoveRequest:
    properties:
      move:
        $ref: '#/definitions/game.Move'
    type: object
  game.GetGameInfoRequest:
    properties:
      game_key:
        type: string
    type: object
  game.GetGameInfoResponse:
    properties:
      game:
        $ref: '#/definitions/game.Game'
      player_black_nickname:
        type: string
      player_white_nickname:
        type: string
    type: object
  game.JsonOKResponse:
    properties:
      text:
        type: string
    type: object
  game.KataGoResponse:
    properties:
      error:
        type: string
      id:
        type: string
      isDuringSearch:
        type: boolean
      moveInfos:
        items:
          $ref: '#/definitions/game.MoveInfo'
        type: array
      ownership:
        items:
          type: number
        type: array
      policy:
        items:
          type: number
        type: array
      rootInfo:
        $ref: '#/definitions/game.RootInfo'
      turnNumber:
        type: integer
    type: object
  game.Move:
    properties:
      color:
        type: string
      coordinates:
        type: string
    type: object
  game.MoveInfo:
    properties:
      edgeVisits:
        type: integer
      edgeWeight:
        type: number
      lcb:
        type: number
      move:
        type: string
      order:
        type: integer
      prior:
        type: number
      pv:
        items:
          type: string
        type: array
      scoreLead:
        type: number
      scoreMean:
        type: number
      scoreSelfplay:
        type: number
      scoreStdev:
        type: number
      utility:
        type: number
      utilityLcb:
        type: number
      visits:
        type: integer
      weight:
        type: number
      winrate:
        type: number
    type: object
  game.NameGameStruct:
    properties:
      count_of_games:
        type: integer
      name:
        type: string
    type: object
  game.Result:
    properties:
      pointDiff:
        type: number
      winColor:
        type: string
    type: object
  game.RootInfo:
    properties:
      currentPlayer:
        type: string
      rawLead:
        type: number
      rawNoResultProb:
        type: number
      rawScoreSelfplay:
        type: number
      rawScoreSelfplayStdev:
        type: number
      rawStScoreError:
        type: number
      rawStWrError:
        type: number
      rawVarTimeLeft:
        type: number
      rawWinrate:
        type: number
      scoreLead:
        type: number
      scoreSelfplay:
        type: number
      scoreStdev:
        type: number
      symHash:
        type: string
      thisHash:
        type: string
      utility:
        type: number
      visits:
        type: integer
      weight:
        type: number
      winrate:
        type: number
    type: object
  game.YearGameStruct:
    properties:
      count_of_games:
        type: integer
      year:
        type: integer
    type: object
  httpresponse.Response:
    properties:
      Body: {}
      Code:
        type: string
      Status:
        type: integer
    type: object
  task.Task:
    properties:
      task_level:
        description: |-
          Difficulty level (chapter index) of the task
          required: true
          example: 3
        type: integer
      task_number:
        description: |-
          Unique identifier for this task
          required: true
          example: 42
        type: integer
      task_sgf:
        description: |-
          Raw SGF content of the problem
          required: true
          example: "(;SZ[19]... )"
        type: string
      task_status:
        description: |-
          Current status, one of "done" or "not_done"
          required: true
          example: "not_done"
        type: string
    type: object
  task.TaskResponse:
    properties:
      page_tmp:
        description: |-
          Current page number (1-based)
          required: true
          example: 1
        type: integer
      page_with_unresolved:
        description: |-
          First page that still contains not_done tasks
          required: true
          example: 1
        type: integer
      tasks:
        description: |-
          Tasks on this page
          required: true
        items:
          $ref: '#/definitions/task.Task'
        type: array
      total_pages:
        description: |-
          Total number of pages available
          required: true
          example: 5
        type: integer
    type: object
  user.User:
    properties:
      Username:
        type: string
      avatar_url:
        type: string
      coins:
        type: integer
      created_at:
        type: string
      current_game_key:
        type: string
      done_tasks_ids:
        items:
          type: integer
        type: array
      email:
        type: string
      id:
        type: string
      passwordHash:
        type: string
      passwordSalt:
        type: string
      rating:
        type: integer
      social_links:
        additionalProperties:
          type: string
        type: object
      statistic:
        $ref: '#/definitions/user.UserStatistic'
      status:
        type: string
      updated_at:
        type: string
    type: object
  user.UserStatistic:
    properties:
      achievements:
        items:
          type: string
        type: array
      draws:
        type: integer
      losses:
        type: integer
      wins:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Документация API авторизации и пользователей
  version: "1.0"
paths:
  /JoinGame:
    post:
      consumes:
      - application/json
      description: Добавляет пользователя в существующую игру.
      parameters:
      - description: Публичный ключ и роль
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.GameJoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно присоединился
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.JsonOKResponse'
              type: object
        "400":
          description: Игра не найдена или неверные параметры
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "409":
          description: Пользователь уже в игре
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.AlreadyInGameResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: Присоединиться к игре
      tags:
      - game
  /NewGame:
    post:
      consumes:
      - application/json
      description: Регистрирует новую игру и возвращает её публичный ключ.
      parameters:
      - description: Параметры новой игры
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.CreateGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Публичный ключ игры
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.GameCreateResponse'
              type: object
        "400":
          description: Ошибочные параметры
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "409":
          description: Пользователь уже в игре
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.AlreadyInGameResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: Создать новую игру человек vs человек
      tags:
      - game
  /analyseCurrent:
    get:
      consumes:
      - application/json
      description: Отправляет SGF в KataGo для анализа (по умолчанию — активная игра).
      parameters:
      - description: Секретный ключ игры
        in: query
        name: secret_key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Результаты анализа
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.KataGoResponse'
              type: object
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Анализ текущей игры
      tags:
      - game
  /generateMove:
    post:
      consumes:
      - application/json
      description: Принимает ход пользователя, генерирует ход бота, возвращает все
        ходы и SGF.
      parameters:
      - description: Ход пользователя
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.GenerateMoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Список ходов и SGF
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.BotGenerateMoveResponse'
              type: object
        "400":
          description: Неверный JSON или логика игры
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Ход против бота
      tags:
      - game
  /getArchive:
    get:
      description: Возвращает архивные игры с фильтрацией и пагинацией.
      parameters:
      - description: Фильтр по году
        in: query
        name: year
        type: integer
      - description: Фильтр по имени игрока
        in: query
        name: name
        type: string
      - description: Номер страницы
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Страница архивных игр
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.ArchiveResponse'
              type: object
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Список игр из архива
      tags:
      - game
  /getAvailableGamesForUser:
    get:
      description: Возвращает постраничный список задач указанного уровня сложности
        с пометкой «решена/нет».
      parameters:
      - description: Номер страницы (1‑based)
        in: query
        name: page
        required: true
        type: integer
      - description: Уровень сложности
        in: query
        name: level
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "416":
          description: Некорректные параметры
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Список задач пользователя
      tags:
      - tasks
  /getGameByPublicKey:
    post:
      consumes:
      - application/json
      description: Возвращает подробную информацию об игре по её публичному ключу.
      parameters:
      - description: Публичный ключ игры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GetGameInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Информация об игре
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.GetGameInfoResponse'
              type: object
        "400":
          description: Некорректный запрос или ошибка JSON
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "404":
          description: Игра не найдена
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Получить игру по публичному ключу
      tags:
      - game
  /getGameFromArchiveById:
    post:
      consumes:
      - application/json
      description: Возвращает запись об архивной игре по её идентификатору.
      parameters:
      - description: Идентификатор архива
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.FindGameInArchive'
      produces:
      - application/json
      responses:
        "200":
          description: Данные игры из архива
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.GameFromArchive'
              type: object
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить игру из архива по ID
      tags:
      - game
  /getNamesInArchive:
    get:
      description: Возвращает имена игроков, отсортированные по количеству игр.
      parameters:
      - description: Номер страницы
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Страница имён игроков
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.ArchiveNamesResponse'
              type: object
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Список игроков в архиве
      tags:
      - game
  /getUserById:
    post:
      consumes:
      - application/json
      description: Возвращает пользователя по его ID. Требуется авторизация по cookie.
      parameters:
      - description: ID пользователя
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.UserFindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Некорректный JSON или пользователь не найден
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить данные пользователя
      tags:
      - user
  /getUserByUsername:
    post:
      consumes:
      - application/json
      description: Возвращает пользователя по его username. Требуется авторизация
        по cookie.
      parameters:
      - description: username пользователя
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.UserFindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Некорректный JSON или пользователь не найден
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Получить данные пользователя
      tags:
      - user
  /getYearsInArchive:
    get:
      description: Возвращает все года, за которые есть игры в архиве.
      produces:
      - application/json
      responses:
        "200":
          description: Список годов
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.ArchiveYearsResponse'
              type: object
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Список годов в архиве
      tags:
      - game
  /leaveGame:
    get:
      description: Покидает текущую игру по публичному ключу.
      parameters:
      - description: Публичный ключ игры
        in: query
        name: gameKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешно вышел из игры
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  $ref: '#/definitions/game.JsonOKResponse'
              type: object
        "400":
          description: Ошибочный запрос
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Покинуть игру
      tags:
      - game
  /login:
    post:
      consumes:
      - application/json
      description: Проверяет логин/пароль и устанавливает cookie `sessionID`.
      parameters:
      - description: Логин и пароль
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Пользователь не найден / неверный пароль / плохой JSON
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Вход пользователя
      tags:
      - auth
  /logout:
    post:
      description: Удаляет сессию, указанную в cookie `sessionID`.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Нет cookie или сессия не найдена
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Выход пользователя
      tags:
      - auth
  /markTaskAsDone:
    get:
      description: Добавляет ID задачи в список выполненных пользователя.
      parameters:
      - description: ID задачи
        in: query
        name: taskID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "416":
          description: Некорректный taskID
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Отметить задачу как решённую
      tags:
      - tasks
  /newBotGame:
    post:
      consumes:
      - application/json
      description: Создаёт игру против KataGo и возвращает секретный ключ.
      parameters:
      - description: Параметры новой игры с ботом
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/game.CreateBotGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Секретный ключ игры
          schema:
            allOf:
            - $ref: '#/definitions/httpresponse.Response'
            - properties:
                Body:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "409":
          description: Бот-игра уже существует
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: Создать игру с ботом
      tags:
      - game
  /register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и сразу устанавливает cookie `sessionID`.
      parameters:
      - description: Учётные данные
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Ответ без тела — только Status
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Некорректный запрос (например, плохой JSON)
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Регистрация пользователя
      tags:
      - auth
  /startGame:
    get:
      description: Апгрейд HTTP→WS для обмена ходами в реальном времени.
      parameters:
      - description: Публичный ключ игры
        in: query
        name: game_id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "101":
          description: Переключение протокола
          schema:
            type: string
        "400":
          description: Ошибка запроса
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "403":
          description: Пользователь не в этой игре
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - ApiKeyAuth: []
      summary: WebSocket-сессия игры
      tags:
      - game
  /storeTasksToMongoByPath:
    get:
      description: Рекурсивно читает все файлы `*.sgf` по указанному пути и сохраняет
        их в коллекцию `tasks`.
      parameters:
      - description: Путь к директории с SGF
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ОК
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "405":
          description: Метод не поддерживается
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "416":
          description: Ошибка чтения файлов
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Загрузить задачи SGF в MongoDB
      tags:
      - tasks
securityDefinitions:
  ApiKeyAuth:
    in: cookie
    name: sessionID
    type: apiKey
swagger: "2.0"
