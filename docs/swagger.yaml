basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      Email:
        type: string
      Password:
        type: string
      Username:
        type: string
    type: object
  auth.UserFindRequest:
    properties:
      user_id:
        type: string
    type: object
  game.ArchiveNamesResponse:
    properties:
      names:
        items:
          $ref: '#/definitions/game.NameGameStruct'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveResponse:
    properties:
      games:
        items:
          $ref: '#/definitions/game.GameFromArchive'
        type: array
      page:
        type: integer
      pages_total:
        type: integer
      total:
        type: integer
    type: object
  game.ArchiveYearsResponse:
    properties:
      years:
        items:
          $ref: '#/definitions/game.YearGameStruct'
        type: array
    type: object
  game.CreateGameRequest:
    properties:
      board_size:
        type: integer
      is_creator_black:
        type: boolean
      komi:
        type: number
      rules:
        type: string
    type: object
  game.Game:
    properties:
      board_size:
        type: integer
      created_at:
        type: string
      current_turn:
        type: string
      game_key:
        description: уникальный ключ
        type: string
      game_key_public:
        type: string
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      player_black:
        type: string
      player_white:
        type: string
      rules:
        type: string
      sgf:
        type: string
      started_at:
        type: string
      status:
        type: string
      users:
        items:
          $ref: '#/definitions/game.GameUser'
        type: array
      who_is_next:
        description: color
        type: string
    type: object
  game.GameCreateResponse:
    properties:
      public_key:
        type: string
    type: object
  game.GameFromArchive:
    properties:
      blackPlayer:
        type: string
      blackRank:
        type: string
      boardSize:
        type: integer
      date:
        type: string
      event:
        type: string
      game_id:
        type: string
      komi:
        type: number
      moves:
        items:
          $ref: '#/definitions/game.Move'
        type: array
      result:
        $ref: '#/definitions/game.Result'
      rules:
        type: string
      sgf:
        type: string
      whitePlayer:
        type: string
      whiteRank:
        type: string
    type: object
  game.GameJoinRequest:
    properties:
      public_key:
        type: string
      role:
        type: string
    type: object
  game.GameLeaveRequest:
    properties:
      public_key:
        type: string
    type: object
  game.GameStateResponse:
    properties:
      move:
        $ref: '#/definitions/game.Move'
      move_info:
        $ref: '#/definitions/game.MoveInfoWS'
    type: object
  game.GameUser:
    properties:
      color:
        type: string
      id:
        type: string
      nickname:
        type: string
      rating:
        type: number
      role:
        type: string
      score:
        type: number
    type: object
  game.GetGameInfoRequest:
    properties:
      game_key:
        type: string
    type: object
  game.GetGameInfoResponse:
    properties:
      game:
        $ref: '#/definitions/game.Game'
      player_black_nickname:
        type: string
      player_white_nickname:
        type: string
    type: object
  game.JsonOKResponse:
    properties:
      text:
        type: string
    type: object
  game.Move:
    properties:
      color:
        type: string
      coordinates:
        type: string
    type: object
  game.MoveInfoWS:
    properties:
      error:
        type: string
      isGameFinished:
        type: boolean
      isMoveCorrect:
        type: boolean
      newSgf:
        type: string
    type: object
  game.NameGameStruct:
    properties:
      count_of_games:
        type: integer
      name:
        type: string
    type: object
  game.Result:
    properties:
      pointDiff:
        type: number
      winColor:
        type: string
    type: object
  game.YearGameStruct:
    properties:
      count_of_games:
        type: integer
      year:
        type: integer
    type: object
  httpresponse.ErrorResponse:
    properties:
      ErrorDescription:
        type: string
    type: object
  task.Task:
    properties:
      task_level:
        description: |-
          Difficulty level (chapter index) of the task
          required: true
          example: 3
        type: integer
      task_number:
        description: |-
          Unique identifier for this task
          required: true
          example: 42
        type: integer
      task_sgf:
        description: |-
          Raw SGF content of the problem
          required: true
          example: "(;SZ[19]... )"
        type: string
      task_status:
        description: |-
          Current status, one of "done" or "not_done"
          required: true
          example: "not_done"
        type: string
    type: object
  task.TaskResponse:
    properties:
      page_tmp:
        description: |-
          Current page number (1-based)
          required: true
          example: 1
        type: integer
      page_with_unresolved:
        description: |-
          First page that still contains not_done tasks
          required: true
          example: 1
        type: integer
      tasks:
        description: |-
          Tasks on this page
          required: true
        items:
          $ref: '#/definitions/task.Task'
        type: array
      total_pages:
        description: |-
          Total number of pages available
          required: true
          example: 5
        type: integer
    type: object
  user.User:
    properties:
      Username:
        type: string
      avatar_url:
        type: string
      coins:
        type: integer
      created_at:
        type: string
      current_game_key:
        type: string
      done_tasks_ids:
        items:
          type: integer
        type: array
      email:
        type: string
      id:
        type: string
      passwordHash:
        type: string
      passwordSalt:
        type: string
      rating:
        type: integer
      social_links:
        additionalProperties:
          type: string
        type: object
      statistic:
        $ref: '#/definitions/user.UserStatistic'
      status:
        type: string
      updated_at:
        type: string
    type: object
  user.UserStatistic:
    properties:
      achievements:
        items:
          type: string
        type: array
      draws:
        type: integer
      losses:
        type: integer
      wins:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Документация API авторизации и пользователей
  version: "1.0"
paths:
  /JoinGame:
    post:
      consumes:
      - application/json
      description: Позволяет пользователю присоединиться к игре, используя публичный
        ключ игры и роль. Требуется авторизация через cookie.
      parameters:
      - description: Запрос на присоединение к игре
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GameJoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь успешно присоединился к игре
          schema:
            $ref: '#/definitions/game.JsonOKResponse'
        "400":
          description: Неверный запрос или игра не найдена
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Разрешен только метод POST
          schema:
            type: string
      summary: Присоединиться к игре
      tags:
      - game
  /NewGame:
    post:
      consumes:
      - application/json
      description: Создает новую игру с указанными параметрами (размер доски, коми
        и роль). Требуется авторизация через cookie.
      parameters:
      - description: Запрос на создание новой игры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.CreateGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Игра успешно создана
          schema:
            $ref: '#/definitions/game.GameCreateResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Разрешен только метод POST
          schema:
            type: string
      summary: Создать новую игру
      tags:
      - game
  /getArchive:
    get:
      consumes:
      - application/json
      description: 'Возвращает архив игр с постраничной разбивкой, с возможностью
        фильтрации по году или имени игрока. Обязательно необходимо указать хотя бы
        один из параметров: год (year) или имя (name).'
      parameters:
      - description: Фильтр по году (обязателен, если не указан параметр name)
        in: query
        name: year
        type: integer
      - description: Фильтр по имени игрока (обязателен, если не указан параметр year)
        in: query
        name: name
        type: string
      - description: Номер страницы для пагинации
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ответ с архивом игр с пагинацией
          schema:
            $ref: '#/definitions/game.ArchiveResponse'
        "400":
          description: Неверный запрос или ошибка при получении архива
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Получить архив игр с пагинацией
      tags:
      - game
  /getAvailableGamesForUser:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of tasks at the specified difficulty level,
        marking each as done or not_done.
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        required: true
        type: integer
      - description: Task difficulty level
        in: query
        name: level
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "401":
          description: Unauthorized"                     // if no valid user cookie
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "416":
          description: Requested Range Not Satisfiable"  // e.g. missing or invalid
            parameters
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get available tasks for a user
      tags:
      - tasks
  /getGameByPublicKey:
    post:
      consumes:
      - application/json
      description: Возвращает подробную информацию об игре по публичному ключу, переданному
        в теле запроса.
      parameters:
      - description: Запрос с публичным ключом игры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GetGameInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение информации об игре
          schema:
            $ref: '#/definitions/game.GetGameInfoResponse'
        "400":
          description: Неверный запрос или ошибка JSON
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Получить игру по публичному ключу
      tags:
      - game
  /getGameFromArchiveById:
    post:
      consumes:
      - application/json
      description: Возвращает отсортированный массив годов (int), доступных в архиве
        чужих партий.
      parameters:
      - description: Номер страницы для пагинации
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ответ с массивом годов
          schema:
            $ref: '#/definitions/game.ArchiveNamesResponse'
        "400":
          description: Ошибка получения годов из архива
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Метод не разрешен
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Получить массив годов из архива
      tags:
      - game
  /getNamesInArchive:
    get:
      consumes:
      - application/json
      description: Возвращает отсортированный массив годов (int), доступных в архиве
        чужих партий.
      parameters:
      - description: Номер страницы для пагинации
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ответ с массивом годов
          schema:
            $ref: '#/definitions/game.ArchiveNamesResponse'
        "400":
          description: Ошибка получения годов из архива
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Метод не разрешен
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Получить массив годов из архива
      tags:
      - game
  /getUserById:
    post:
      consumes:
      - application/json
      description: Возвращает пользователя по ID. Требуется авторизация (cookie sessionID).
      parameters:
      - description: ID пользователя для поиска
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/auth.UserFindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Only POST method is allowed
          schema:
            type: string
      summary: Получение информации о пользователе
      tags:
      - user
  /getYearsInArchive:
    get:
      consumes:
      - application/json
      description: Возвращает отсортированный массив годов (int), доступных в архиве
        чужих партий.
      produces:
      - application/json
      responses:
        "200":
          description: Ответ с массивом годов
          schema:
            $ref: '#/definitions/game.ArchiveYearsResponse'
        "400":
          description: Ошибка получения годов из архива
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Метод не разрешен
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Получить массив годов из архива
      tags:
      - game
  /leave:
    post:
      consumes:
      - application/json
      description: Позволяет пользователю покинуть игру, передав публичный ключ игры.
        Требуется авторизация через cookie.
      parameters:
      - description: Запрос на покидание игры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.GameLeaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь успешно покинул игру
          schema:
            type: string
        "400":
          description: Неверный запрос или ошибка JSON
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "405":
          description: Разрешен только метод POST
          schema:
            type: string
      summary: Покинуть игру
      tags:
      - game
  /login:
    post:
      consumes:
      - application/json
      description: Авторизует пользователя по логину и паролю, устанавливает cookie
        sessionID
      parameters:
      - description: Данные пользователя для входа
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Вход пользователя
      tags:
      - auth
  /logout:
    post:
      description: Удаляет сессию пользователя по cookie sessionID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Выход пользователя
      tags:
      - auth
  /markTaskAsDone:
    get:
      consumes:
      - application/json
      description: Marks the task with the given ID as completed in the user's record.
      parameters:
      - description: Unique identifier of the task to mark as done
        in: query
        name: taskID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "401":
          description: Unauthorized"                     // if no valid user cookie
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "416":
          description: Requested Range Not Satisfiable"  // e.g. missing or invalid
            taskID
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Mark a task as done for the current user
      tags:
      - tasks
  /register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и устанавливает cookie sessionID
      parameters:
      - description: Данные пользователя для регистрации
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /startGame:
    get:
      consumes:
      - application/json
      description: Обновляет HTTP-соединение до WebSocket для обмена ходами в режиме
        реального времени.
      parameters:
      - description: Идентификатор игры
        in: query
        name: game_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Обновление состояния игры в реальном времени
          schema:
            $ref: '#/definitions/game.GameStateResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/httpresponse.ErrorResponse'
      summary: Запуск игры через WebSocket
      tags:
      - game
  /storeTasksToMongoByPath:
    get:
      consumes:
      - application/json
      description: Reads all `.sgf` files from the given path and saves them into
        the MongoDB `tasks` collection.
      parameters:
      - description: Filesystem path to directory containing SGF files
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully stored tasks in MongoDB
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "416":
          description: Requested Range Not Satisfiable"  // e.g. error during file
            processing or Mongo insert
          schema:
            type: string
      summary: Store tasks in MongoDB
      tags:
      - tasks
securityDefinitions:
  ApiKeyAuth:
    in: cookie
    name: sessionID
    type: apiKey
swagger: "2.0"
